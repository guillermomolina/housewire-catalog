kind: place_type
id: LightPoint
icon: lightbulb
label: Light point / luminaire outlet
label_es: Punto de luz
description: >
  Light point (ceiling/wall hole, lampholder, luminaire outlet).
  Not a DeviceBox: no socket/switch mechanism. Physical end of conduits
  (typical mouth B1-1 or N1). A Luminaire element (electrical layer) may be
  added later under elements.
description_es: >
  Punto de luz (hueco techo/pared, portalámparas, salida de luminaria). No
  es DeviceBox: sin mecanismo de enchufe/interruptor. Extremo físico de
  tubos (boca típica B1-1 o N1). Más adelante puede añadirse un elemento
  Luminaire (capa eléctrica) bajo elements.
terminals: {}
defaults:
  subtype: ceiling-hole
